[package]
name = "fscl-core"
version = "0.1.0"
edition = "2024"

[dependencies]
fmt = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.18"
dotenv = "0.15.0"
anyhow = "1.0.102"
sqlx = { version = "0.8.6", features = [ "postgres", "runtime-tokio" ]}